<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2b2117">
<title>샤들링: 몬스터 퓨전 RPG (시제품)</title>
<link rel="stylesheet" href="css/style.css?v=1107r">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="row cur-row"><div class="cur" id="gold"></div><div class="cur" id="rbs"></div></div>
    <div class="row" style="gap:6px"><button id="mute" class="icon-btn" type="button" aria-label="소리 켜기/끄기"><img src="art/ui/sound.png" alt=""></button><button class="icon-btn" type="button" data-act="tab" data-tab="settings" aria-label="설정"><img src="art/ui/settings.png" alt=""></button></div>
  </header>
  <main id="screen"></main>
  <div id="dock" hidden></div>
  <nav id="tabs">
    <button data-tab="home"><img class="ti" src="art/ui/home.png" alt="">마을</button>
    <button data-tab="stages"><img class="ti" src="art/ui/battle.png" alt="">전투</button>
    <button data-tab="monsters"><img class="ti" src="art/ui/rainbow.png" alt="">샤들링</button>
    <button data-tab="fusion"><img class="ti" src="art/ui/shard.png" alt="">합성</button>
    <button data-tab="bag"><img class="ti" src="art/ui/bag.png" alt="">가방</button>
    <button data-tab="dex"><img class="ti" src="art/ui/dex.png" alt="">도감</button>
  </nav>
  <div id="banner" hidden></div>
  <div id="sheet" hidden></div>
  <div id="overlay" hidden></div>
  <div id="toast" hidden></div>
</div>
<script src="js/balance.js?v=1107r"></script>
<script src="js/data.js?v=1107r"></script>
<script src="js/logic.js?v=1107r"></script>
<script src="js/sound.js?v=1107r"></script>
<script src="js/ui.js?v=1107r"></script>
</body>
</html>
