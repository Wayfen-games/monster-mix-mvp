<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1830">
<title>샤들링: 몬스터 퓨전 RPG (시제품)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">샤들링 <span class="tag">MVP v2</span></div>
    <div class="gold" id="gold"></div>
  </header>
  <main id="screen"></main>
  <div id="dock" hidden></div>
  <nav id="tabs">
    <button data-tab="home"><span class="ti">⌂</span>마을</button>
    <button data-tab="stages"><span class="ti">⚔</span>전투</button>
    <button data-tab="monsters"><span class="ti">◆</span>샤들링</button>
    <button data-tab="fusion"><span class="ti">✦</span>합성</button>
    <button data-tab="bag"><span class="ti">🎒</span>가방</button>
    <button data-tab="dex"><span class="ti">▦</span>도감</button>
  </nav>
  <div id="banner" hidden></div>
  <div id="sheet" hidden></div>
  <div id="overlay" hidden></div>
  <div id="toast" hidden></div>
</div>
<script src="js/balance.js"></script>
<script src="js/data.js"></script>
<script src="js/logic.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
